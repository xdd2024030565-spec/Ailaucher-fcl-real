name: Build AI Bridge Mod

# v4: 修复依赖仓库配置 + 失败日志自动入库
# 流程：
# 1. 从 AI-Minecraft-Launcher 仓库拉取 Mod 源码；
# 2. 转为独立单模块项目（settings 含插件仓库 + 依赖仓库）；
# 3. Gradle 9.7.1 + JDK 21 构建（fabric-loom 1.17.x 要求 9.5+，实测验证 9.7.1 存在）；
# 4. 产物自动提交到 FCL/src/main/assets/ai/ai-bridge.jar；
# 5. 失败时：构建日志自动提交到 .ci-logs/ 并上传 artifact（便于快速诊断）。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-ai-bridge.yml'

jobs:
  build-mod:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout FCL fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone AI-Minecraft-Launcher (mod source)
        run: |
          git clone --depth 1 https://github.com/xdd2024030565-spec/AI-Minecraft-Launcher.git aimc-src
          ls -la aimc-src/AiBridgeMod

      - name: Prepare standalone mod project
        run: |
          mkdir -p mod-build
          cp -r aimc-src/AiBridgeMod/. mod-build/
          rm -rf mod-build/build mod-build/.gradle
          # 独立项目 settings：插件仓库 + 依赖仓库（不继承主仓库插件链；避免 FAIL_ON_PROJECT_REPOS 冲突）
          cat > mod-build/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  maven("https://maven.fabricmc.net") { name = "Fabric" }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  maven("https://maven.fabricmc.net") { name = "Fabric" }
                  mavenCentral()
                  google()
              }
          }
          rootProject.name = "ai-bridge"
          EOF
          echo "--- mod-build 内容 ---"
          ls -la mod-build
          echo "--- build.gradle.kts 预览 ---"
          head -40 mod-build/build.gradle.kts

      - name: Setup Gradle 9.7.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle-9.7.1-bin.zip" "https://services.gradle.org/distributions/gradle-9.7.1-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.7.1-bin.zip" -d "$HOME"
          "$HOME/gradle-9.7.1/bin/gradle" --version
          echo "$HOME/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      - name: Build AI Bridge Mod
        working-directory: mod-build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee ../ai-bridge-build.log

      - name: Locate built jar
        id: locate
        run: |
          JAR=$(find mod-build/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "未找到构建产物，目录内容："
            ls -la mod-build/build/libs || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "找到产物: $JAR"

      - name: Copy jar into FCL assets
        run: |
          mkdir -p FCL/src/main/assets/ai
          cp "${{ steps.locate.outputs.jar }}" FCL/src/main/assets/ai/ai-bridge.jar
          ls -la FCL/src/main/assets/ai/

      - name: Commit and push jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FCL/src/main/assets/ai/ai-bridge.jar
          if git diff --cached --quiet; then
            echo "jar 无变化，跳过提交"
          else
            git commit -m "chore: update ai-bridge.jar (auto-built)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .ci-logs
          if [ -f ai-bridge-build.log ]; then
            cp ai-bridge-build.log .ci-logs/ai-bridge-build.log
          else
            echo "(no log captured)" > .ci-logs/ai-bridge-build.log
          fi
          git add -f .ci-logs/ai-bridge-build.log
          git commit -m "chore: AI Bridge build log [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-bridge-build-log
          path: ai-bridge-build.log
